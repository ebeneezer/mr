<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="1080" height="1100" viewBox="0 0 1080 1100" role="img" aria-labelledby="title desc">
  <title id="title">Finite packet planning and ordered publication</title>
  <desc id="desc">Three numbered panels show owner demand and span reservation, independently pinned finite workers, and exact ledger acceptance followed by domain-specific adoption.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f4b54"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fa3"/>
    </marker>
    <style>
      .title { font: 700 25px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .panel-title { font: 700 20px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .heading { font: 700 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #59656e; letter-spacing: 0.4px; }
      .body { font: 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .small { font: 13px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #3f4b54; }
      .code { font: 14px 'Latin Modern Mono', 'DejaVu Sans Mono', monospace; fill: #182128; }
      .badge { font: 700 18px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #ffffff; text-anchor: middle; }
      .box { fill: #f7f8f8; stroke: #27313a; stroke-width: 1.4; }
      .axis { fill: none; stroke: #3f4b54; stroke-width: 1.6; }
      .flow { fill: none; stroke: #3f4b54; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2f6fa3; stroke-width: 2; marker-end: url(#arrowBlue); }
      .cached { fill: #dcedeb; stroke: #317c70; stroke-width: 1.4; }
      .anchor { fill: #f3e8d1; stroke: #a77b2f; stroke-width: 1.4; }
      .visible { fill: #dce8f4; stroke: #2f6fa3; stroke-width: 1.8; }
      .prefetch { fill: #e5f0dd; stroke: #588646; stroke-width: 1.4; }
      .missing { fill: #f4dfd9; stroke: #ad563e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1080" height="1100" fill="#ffffff"/>
  <text x="40" y="35" class="title">FINITE PACKETS, OWNER LEDGERS, AND ORDERED PUBLICATION</text>
  <text x="40" y="59" class="small">A lane classifies work; the domain owner reserves spans and decides when an exact result becomes visible.</text>

  <rect x="40" y="82" width="1000" height="260" rx="8" class="box"/>
  <circle cx="72" cy="114" r="20" fill="#2f6fa3"/>
  <text x="72" y="121" class="badge">1</text>
  <text x="105" y="120" class="panel-title">Viewport demand reserves only uncovered spans</text>
  <text x="70" y="157" class="heading">EDITOR OWNER ED:42 · DOCUMENT VERSION N · GENERATION 17</text>
  <line x1="72" y1="208" x2="694" y2="208" class="axis" marker-end="url(#arrow)"/>
  <text x="70" y="191" class="small">BOF</text>
  <text x="668" y="191" class="small">EOF</text>
  <rect x="120" y="191" width="128" height="34" class="cached"/>
  <rect x="315" y="191" width="92" height="34" class="anchor"/>
  <rect x="407" y="191" width="116" height="34" class="visible"/>
  <rect x="523" y="191" width="138" height="34" class="prefetch"/>
  <text x="184" y="212" class="small" text-anchor="middle">confirmed</text>
  <text x="361" y="212" class="small" text-anchor="middle">context</text>
  <text x="465" y="212" class="small" text-anchor="middle">viewport</text>
  <text x="592" y="212" class="small" text-anchor="middle">prefetch</text>
  <line x1="248" y1="208" x2="315" y2="208" stroke="#8c979e" stroke-width="1.5" stroke-dasharray="7 6"/>
  <text x="70" y="260" class="body">The owner subtracts confirmed coverage and active reservations</text>
  <text x="70" y="282" class="body">before packet creation.</text>
  <text x="70" y="317" class="code">submitPacket(owner, generation, BOF|EOF, [start, end))</text>
  <rect x="730" y="140" width="280" height="190" rx="5" fill="#eef4f3" stroke="#317c70" stroke-width="1.4"/>
  <text x="750" y="167" class="heading">DOMAIN LEDGER</text>
  <text x="750" y="196" class="code">confirmed = {[0, 8192)}</text>
  <text x="750" y="223" class="code">accepted = {[12288, 16384)}</text>
  <text x="750" y="250" class="code">reserved = {[16384, 20480)}</text>
  <text x="750" y="279" class="small">No focus gate · no duplicate span</text>
  <text x="750" y="302" class="small">Older finite generations</text>
  <text x="750" y="322" class="small">may remain useful.</text>

  <path d="M540 343 L540 376" class="flow-blue"/>
  <text x="557" y="366" class="small">independent execution</text>

  <rect x="40" y="385" width="1000" height="280" rx="8" class="box"/>
  <circle cx="72" cy="417" r="20" fill="#2f6fa3"/>
  <text x="72" y="424" class="badge">2</text>
  <text x="105" y="423" class="panel-title">Each finite work unit owns one stable worker execution</text>
  <text x="70" y="461" class="heading">GLOBAL WORKER ORDINAL · STRICT MODULO CORE ASSIGNMENT</text>

  <rect x="70" y="485" width="270" height="126" rx="6" class="visible"/>
  <text x="90" y="514" class="panel-title">W41 · cpu:9</text>
  <text x="90" y="541" class="code">SYN · BOF · [8192,12288)</text>
  <text x="90" y="568" class="small">ReadSnapshot · finite packet</text>
  <text x="90" y="592" class="small">result-ready second</text>

  <rect x="405" y="485" width="270" height="126" rx="6" class="prefetch"/>
  <text x="425" y="514" class="panel-title">W42 · cpu:10</text>
  <text x="425" y="541" class="code">SYN · EOF · [12288,16384)</text>
  <text x="425" y="568" class="small">ReadSnapshot · finite packet</text>
  <text x="425" y="592" class="small">result-ready first</text>

  <rect x="740" y="485" width="270" height="126" rx="6" class="anchor"/>
  <text x="760" y="514" class="panel-title">W43 · cpu:11</text>
  <text x="760" y="541" class="code">SYN · EOF · [16384,20480)</text>
  <text x="760" y="568" class="small">ReadSnapshot · finite packet</text>
  <text x="760" y="592" class="small">result-ready third</text>

  <text x="70" y="641" class="code">assignedCore = allowedCoreIds[workerOrdinal % allowedCoreIds.size()]</text>
  <text x="760" y="630" class="small">More workers than cores</text>
  <text x="760" y="649" class="small">continue modulo.</text>

  <path d="M540 666 L540 699" class="flow-blue"/>
  <text x="557" y="690" class="small">bounded UI mailbox</text>

  <rect x="40" y="708" width="1000" height="294" rx="8" class="box"/>
  <circle cx="72" cy="740" r="20" fill="#2f6fa3"/>
  <text x="72" y="747" class="badge">3</text>
  <text x="105" y="746" class="panel-title">Exact owner acceptance precedes domain-specific publication</text>
  <text x="70" y="783" class="heading">RESULT GATE</text>

  <rect x="70" y="806" width="270" height="72" rx="5" class="cached"/>
  <text x="205" y="835" class="panel-title" text-anchor="middle">ACCEPTED</text>
  <text x="205" y="860" class="small" text-anchor="middle">exact owner · task · version · span</text>
  <path d="M340 842 L405 842" class="flow"/>
  <rect x="405" y="806" width="270" height="72" rx="5" class="visible"/>
  <text x="540" y="835" class="panel-title" text-anchor="middle">CONFIRMED FRONTIER</text>
  <text x="540" y="860" class="small" text-anchor="middle">stateIn matches predecessor</text>
  <path d="M675 842 L740 842" class="flow"/>
  <rect x="740" y="806" width="270" height="72" rx="5" class="prefetch"/>
  <text x="875" y="835" class="panel-title" text-anchor="middle">ADOPTED</text>
  <text x="875" y="860" class="small" text-anchor="middle">immutable visible projection</text>

  <rect x="70" y="895" width="605" height="96" rx="5" fill="#eef4f3" stroke="#317c70" stroke-width="1.4"/>
  <text x="90" y="922" class="body">Stateless packets may publish out of order;</text>
  <text x="90" y="947" class="body">stateful syntax and folding advance in order.</text>
  <text x="90" y="974" class="small">Older matching packets extend the ledger, not the current viewport.</text>
  <rect x="730" y="895" width="280" height="96" rx="5" class="missing"/>
  <text x="750" y="924" class="panel-title">DISCARDED</text>
  <text x="750" y="951" class="small">mismatch or invalid stateIn</text>
  <text x="750" y="975" class="small">never rebase</text>

  <rect x="40" y="1023" width="1000" height="56" rx="5" fill="#e8f0f2" stroke="#27313a" stroke-width="1.2"/>
  <text x="60" y="1047" class="heading">INVALIDATION RULES</text>
  <text x="60" y="1069" class="small">Cursor movement retains compatible work · document or language changes invalidate keyed state · drawing never performs the analysis.</text>
</svg>
