<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1320" viewBox="0 0 940 1320" role="img" aria-labelledby="title desc">
  <title id="title">Settings bootstrap from persisted source to editor UI</title>
  <desc id="desc">Five numbered panels show settings source acquisition, normalization and canonicalization, reset and compilation, final VM startup application, and UI projection from the authoritative runtime model.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f4b54"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fa3"/>
    </marker>
    <style>
      .title { font: 700 25px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .panel-title { font: 700 19px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .heading { font: 700 14px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #59656e; letter-spacing: 0.4px; }
      .body { font: 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .small { font: 13px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #3f4b54; }
      .code { font: 14px 'Latin Modern Mono', 'DejaVu Sans Mono', monospace; fill: #182128; }
      .badge { font: 700 18px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #ffffff; text-anchor: middle; }
      .box { fill: #f7f8f8; stroke: #27313a; stroke-width: 1.4; }
      .flow { fill: none; stroke: #3f4b54; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2f6fa3; stroke-width: 2; marker-end: url(#arrowBlue); }
      .blue { fill: #dce8f4; stroke: #2f6fa3; stroke-width: 1.6; }
      .green { fill: #dcedeb; stroke: #317c70; stroke-width: 1.4; }
      .lime { fill: #e5f0dd; stroke: #588646; stroke-width: 1.4; }
      .gold { fill: #f3e8d1; stroke: #a77b2f; stroke-width: 1.4; }
      .red { fill: #f4dfd9; stroke: #ad563e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="940" height="1320" fill="#ffffff"/>
  <text x="35" y="35" class="title">SETTINGS BOOTSTRAP: PERSISTED SOURCE TO EDITOR UI</text>
  <text x="35" y="59" class="small">Bootstrap owns source normalization; the VM performs final apply; the runtime model is the sole live authority.</text>

  <rect x="35" y="82" width="870" height="174" rx="8" class="box"/>
  <circle cx="67" cy="114" r="20" fill="#2f6fa3"/>
  <text x="67" y="121" class="badge">1</text>
  <text x="100" y="120" class="panel-title">Ensure and read one persisted settings source</text>
  <rect x="67" y="151" width="806" height="75" rx="6" class="blue"/>
  <text x="87" y="180" class="code">settings.mrmac</text>
  <text x="87" y="205" class="body">Create current defaults when missing; unreadable input becomes empty normalization input.</text>

  <path d="M470 256 L470 282" class="flow-blue"/>

  <rect x="35" y="287" width="870" height="252" rx="8" class="box"/>
  <circle cx="67" cy="319" r="20" fill="#2f6fa3"/>
  <text x="67" y="326" class="badge">2</text>
  <text x="100" y="325" class="panel-title">Version-gate, normalize, and derive canonical current source</text>
  <rect x="67" y="356" width="528" height="143" rx="6" class="gold"/>
  <text x="87" y="385" class="heading">COMPLETE STAGED SNAPSHOT</text>
  <text x="87" y="414" class="body">Reject future Build Epochs.</text>
  <text x="87" y="440" class="body">Keep known values; discard obsolete or unknown tokens.</text>
  <text x="87" y="463" class="body">Supply defaults; rewrite only when normalization</text>
  <text x="87" y="485" class="body">changed the input.</text>
  <rect x="623" y="356" width="250" height="62" rx="6" class="green"/>
  <text x="643" y="382" class="panel-title">WORKSPACE</text>
  <text x="643" y="404" class="small">protected persistence extension</text>
  <rect x="623" y="437" width="250" height="62" rx="6" class="blue"/>
  <text x="643" y="463" class="panel-title">KEYMAP</text>
  <text x="643" y="485" class="small">bounded staging exception</text>
  <text x="67" y="523" class="small">Neither extension becomes a second runtime settings authority.</text>

  <path d="M470 539 L470 565" class="flow-blue"/>

  <rect x="35" y="570" width="870" height="212" rx="8" class="box"/>
  <circle cx="67" cy="602" r="20" fill="#2f6fa3"/>
  <text x="67" y="609" class="badge">3</text>
  <text x="100" y="608" class="panel-title">Reset preload state and compile the canonical source</text>
  <rect x="67" y="639" width="365" height="104" rx="6" class="gold"/>
  <text x="249" y="669" class="panel-title" text-anchor="middle">CURRENT DEFAULTS</text>
  <text x="249" y="695" class="small" text-anchor="middle">preload reset · not final authority</text>
  <text x="249" y="719" class="small" text-anchor="middle">no direct UI application</text>
  <path d="M432 691 L508 691" class="flow"/>
  <rect x="508" y="639" width="365" height="104" rx="6" class="blue"/>
  <text x="690" y="669" class="panel-title" text-anchor="middle">CANONICAL COMPILER</text>
  <text x="690" y="695" class="small" text-anchor="middle">current MRMAC source → bytecode</text>
  <text x="690" y="719" class="small" text-anchor="middle">compile failure stops startup apply</text>
  <text x="67" y="767" class="small">The persisted source has now been normalized, but the final VM apply has not yet occurred.</text>

  <path d="M470 782 L470 808" class="flow-blue"/>

  <rect x="35" y="813" width="870" height="254" rx="8" class="box"/>
  <circle cx="67" cy="845" r="20" fill="#2f6fa3"/>
  <text x="67" y="852" class="badge">4</text>
  <text x="100" y="851" class="panel-title">The VM performs the only authoritative startup apply</text>
  <rect x="67" y="882" width="806" height="75" rx="6" class="green"/>
  <text x="87" y="911" class="code">execute canonical bytecode in startup-settings mode</text>
  <text x="87" y="936" class="body">MRSETUP applies validated settings; runtime errors stop the operation.</text>
  <path d="M470 957 L470 983" class="flow"/>
  <rect x="67" y="988" width="806" height="52" rx="6" class="lime"/>
  <text x="87" y="1019" class="body">Flush the startup keymap batch and clear dirty state — authority changes here.</text>
  <text x="67" y="1054" class="small">The central runtime settings model now owns live configuration; UI code remains a consumer.</text>

  <path d="M470 1067 L470 1093" class="flow-blue"/>

  <rect x="35" y="1098" width="870" height="175" rx="8" class="box"/>
  <circle cx="67" cy="1130" r="20" fill="#2f6fa3"/>
  <text x="67" y="1137" class="badge">5</text>
  <text x="100" y="1136" class="panel-title">The editor refreshes its snapshot and projects configured layout</text>
  <rect x="67" y="1167" width="806" height="75" rx="6" class="blue"/>
  <text x="470" y="1198" class="panel-title" text-anchor="middle">EDITOR UI</text>
  <text x="470" y="1223" class="small" text-anchor="middle">TVision projection of authoritative runtime settings · never a competing settings store</text>

  <rect x="35" y="1284" width="870" height="27" rx="5" fill="#e8f0f2" stroke="#27313a" stroke-width="1.2"/>
  <text x="55" y="1302" class="small">The normal save path is deliberately absent: persistence is a separate contract from bootstrap application.</text>
</svg>
