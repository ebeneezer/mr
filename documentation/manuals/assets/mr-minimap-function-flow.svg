<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1320" viewBox="0 0 940 1320" role="img" aria-labelledby="title desc">
  <title id="title">MR minimap warm-window and projection flow</title>
  <desc id="desc">Six numbered panels show request geometry, bounded ledger planning, finite text packets, immutable overlay packets, exact visible-window adoption, and pure TVision drawing.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f4b54"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fa3"/>
    </marker>
    <style>
      .title { font: 700 25px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .panel-title { font: 700 19px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .heading { font: 700 14px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #59656e; letter-spacing: 0.4px; }
      .body { font: 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .small { font: 13px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #3f4b54; }
      .code { font: 14px 'Latin Modern Mono', 'DejaVu Sans Mono', monospace; fill: #182128; }
      .badge { font: 700 18px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #ffffff; text-anchor: middle; }
      .box { fill: #f7f8f8; stroke: #27313a; stroke-width: 1.4; }
      .flow { fill: none; stroke: #3f4b54; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2f6fa3; stroke-width: 2; marker-end: url(#arrowBlue); }
      .blue { fill: #dce8f4; stroke: #2f6fa3; stroke-width: 1.6; }
      .green { fill: #dcedeb; stroke: #317c70; stroke-width: 1.4; }
      .lime { fill: #e5f0dd; stroke: #588646; stroke-width: 1.4; }
      .gold { fill: #f3e8d1; stroke: #a77b2f; stroke-width: 1.4; }
      .red { fill: #f4dfd9; stroke: #ad563e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="940" height="1320" fill="#ffffff"/>
  <text x="35" y="35" class="title">MINIMAP WARM-WINDOW AND PROJECTION FLOW</text>
  <text x="35" y="59" class="small">Text density and overlays are immutable derived state; draw() consumes adopted projections only.</text>

  <rect x="35" y="82" width="870" height="142" rx="8" class="box"/>
  <circle cx="67" cy="114" r="20" fill="#2f6fa3"/>
  <text x="67" y="121" class="badge">1</text>
  <text x="100" y="120" class="panel-title">Semantic or viewport change defines the exact key</text>
  <rect x="67" y="143" width="806" height="55" rx="5" class="blue"/>
  <text x="87" y="168" class="code">ED owner · document/version · rows/body width · viewport width · mode · source span</text>
  <text x="87" y="189" class="small">Braille: four source lines per row · fallback: one line per row · no request originates in draw()</text>

  <path d="M470 224 L470 250" class="flow-blue"/>

  <rect x="35" y="255" width="870" height="211" rx="8" class="box"/>
  <circle cx="67" cy="287" r="20" fill="#2f6fa3"/>
  <text x="67" y="294" class="badge">2</text>
  <text x="100" y="293" class="panel-title">The editor-local ledger plans one directional acquisition window</text>
  <line x1="67" y1="357" x2="873" y2="357" stroke="#3f4b54" stroke-width="1.6"/>
  <rect x="111" y="340" width="178" height="34" class="green"/>
  <rect x="289" y="340" width="120" height="34" class="gold"/>
  <rect x="409" y="340" width="142" height="34" class="blue"/>
  <rect x="551" y="340" width="238" height="34" class="lime"/>
  <text x="200" y="361" class="small" text-anchor="middle">confirmed warm window</text>
  <text x="349" y="361" class="small" text-anchor="middle">BOF guard</text>
  <text x="480" y="361" class="small" text-anchor="middle">visible window</text>
  <text x="670" y="361" class="small" text-anchor="middle">directional prewarm</text>
  <text x="67" y="407" class="code">capacity = max(8, 4 * allowedCoreCount) visible windows</text>
  <text x="67" y="437" class="body">Confirmed coverage and active reservations are subtracted; small movement creates no new wave.</text>

  <path d="M470 466 L470 492" class="flow-blue"/>

  <rect x="35" y="497" width="870" height="230" rx="8" class="box"/>
  <circle cx="67" cy="529" r="20" fill="#2f6fa3"/>
  <text x="67" y="536" class="badge">3</text>
  <text x="100" y="535" class="panel-title">At most one finite text packet per allowed core executes independently</text>
  <rect x="67" y="566" width="250" height="104" rx="6" class="blue"/>
  <text x="87" y="594" class="panel-title">W221 · MAP · BOF</text>
  <text x="87" y="620" class="code">[7,790,560, 7,790,720)</text>
  <text x="87" y="645" class="small">line masks + inverse row mapping</text>
  <rect x="345" y="566" width="250" height="104" rx="6" class="green"/>
  <text x="365" y="594" class="panel-title">W222 · MAP · EOF</text>
  <text x="365" y="620" class="code">[7,790,720, 7,790,880)</text>
  <text x="365" y="645" class="small">line masks + inverse row mapping</text>
  <rect x="623" y="566" width="250" height="104" rx="6" class="lime"/>
  <text x="643" y="594" class="panel-title">W223 · MAP · EOF</text>
  <text x="643" y="620" class="code">[7,790,880, 7,791,040)</text>
  <text x="643" y="645" class="small">line masks + inverse row mapping</text>
  <text x="67" y="700" class="body">Four display-line masks and two horizontal dot columns form each Braille cell pattern.</text>

  <path d="M470 727 L470 753" class="flow-blue"/>

  <rect x="35" y="758" width="870" height="180" rx="8" class="box"/>
  <circle cx="67" cy="790" r="20" fill="#2f6fa3"/>
  <text x="67" y="797" class="badge">4</text>
  <text x="100" y="796" class="panel-title">Revisioned overlay sources create independent component packets</text>
  <rect x="67" y="827" width="250" height="76" rx="6" class="gold"/>
  <text x="192" y="856" class="panel-title" text-anchor="middle">SEARCH / SELECTION</text>
  <text x="192" y="881" class="small" text-anchor="middle">only this component changes</text>
  <rect x="345" y="827" width="250" height="76" rx="6" class="red"/>
  <text x="470" y="856" class="panel-title" text-anchor="middle">DIRTY / DIAGNOSTICS</text>
  <text x="470" y="881" class="small" text-anchor="middle">immutable range vectors</text>
  <rect x="623" y="827" width="250" height="76" rx="6" class="green"/>
  <text x="748" y="856" class="panel-title" text-anchor="middle">FILE COMPARE</text>
  <text x="748" y="881" class="small" text-anchor="middle">line kinds + slices</text>
  <text x="67" y="925" class="small">No range signatures, document-wide scans, or overlay construction remain in draw().</text>

  <path d="M470 938 L470 964" class="flow-blue"/>

  <rect x="35" y="969" width="870" height="174" rx="8" class="box"/>
  <circle cx="67" cy="1001" r="20" fill="#2f6fa3"/>
  <text x="67" y="1008" class="badge">5</text>
  <text x="100" y="1007" class="panel-title">Exact visible coverage may be adopted before prewarming finishes</text>
  <rect x="67" y="1038" width="806" height="75" rx="6" class="green"/>
  <text x="87" y="1066" class="code">task + ED owner + generation + document/version + geometry + mode + source span</text>
  <text x="87" y="1092" class="body">Older finite packets may enlarge the ledger but cannot replace a newer viewport projection.</text>
  <text x="67" y="1132" class="small">Bounded retention: max(4, 2 * allowedCoreCount) complete warm windows.</text>

  <path d="M470 1143 L470 1169" class="flow-blue"/>

  <rect x="35" y="1174" width="870" height="122" rx="8" class="box"/>
  <circle cx="67" cy="1206" r="20" fill="#2f6fa3"/>
  <text x="67" y="1213" class="badge">6</text>
  <text x="100" y="1212" class="panel-title">drawGutter projects adopted data through ordinary TVision buffers</text>
  <rect x="67" y="1238" width="806" height="37" rx="5" fill="#e8f0f2" stroke="#27313a" stroke-width="1.2"/>
  <text x="87" y="1262" class="small">Braille pattern · overlay colour priority · viewport marker · separator · native scrollbar remains independent</text>
</svg>
