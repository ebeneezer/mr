<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1320" viewBox="0 0 940 1320" role="img" aria-labelledby="title desc">
  <title id="title">MR minimap functional pipeline</title>
  <desc id="desc">Vertical technical diagram of minimap geometry, its single-window cache, sampling-window selection, one-worker background Braille reduction with per-activation CPU placement, UI-thread result adoption, overlay masks, and TVision projection.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#26364a"/>
    </marker>
    <marker id="arrowLight" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .sans { font-family: "DejaVu Sans", Arial, sans-serif; fill: #162235; }
      .mono { font-family: "DejaVu Sans Mono", Consolas, monospace; fill: #162235; }
      .title { font-size: 23px; font-weight: 700; letter-spacing: .5px; }
      .head { font-size: 18px; font-weight: 700; }
      .stage { font-size: 17px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; }
      .inverse { fill: #ffffff; }
      .muted { fill: #516174; }
      .card { fill: #ffffff; stroke: #9daaba; stroke-width: 1.6; }
      .flow { fill: none; stroke: #26364a; stroke-width: 2.2; marker-end: url(#arrow); }
      .branch { fill: none; stroke: #64748b; stroke-width: 1.8; marker-end: url(#arrowLight); }
    </style>
  </defs>

  <rect width="940" height="1320" fill="#f4f6f8"/>

  <rect x="35" y="22" width="870" height="72" rx="8" fill="#162235"/>
  <text x="470" y="52" text-anchor="middle" class="mono title inverse">MRFileEditor::draw()</text>
  <text x="470" y="78" text-anchor="middle" class="sans body inverse">request derived patterns · compose live overlays · project through TVision</text>

  <path d="M470 94 L470 112" class="flow"/>
  <rect x="70" y="116" width="800" height="82" rx="8" class="card"/>
  <circle cx="96" cy="142" r="17" fill="#2d69a6"/>
  <text x="96" y="148" text-anchor="middle" class="sans stage inverse">1</text>
  <text x="124" y="143" class="sans stage">GEOMETRY AND SOURCE TICKET</text>
  <text x="124" y="168" class="mono body">position · bodyX/bodyWidth · infoX · rows · viewportWidth · marker glyph · palette</text>
  <text x="124" y="188" class="mono body">documentId/version · topLine · exact/estimated totalLines · ReadSnapshot</text>

  <path d="M470 198 L470 216" class="flow"/>
  <rect x="70" y="220" width="800" height="100" rx="8" fill="#f3f8fd" stroke="#2d69a6" stroke-width="1.7"/>
  <circle cx="96" cy="247" r="17" fill="#2d69a6"/>
  <text x="96" y="253" text-anchor="middle" class="sans stage inverse">2</text>
  <text x="124" y="248" class="mono stage">samplingWindowFor(totalLines, topLine, rows, braille)</text>
  <text x="124" y="275" class="mono body">S = rows × (Braille ? 4 : 1)</text>
  <text x="124" y="298" class="mono body">total ≤ S : [0,total)   else : start = clamp(top − ⌊S/2⌋, 0, total − S)</text>

  <path d="M470 320 L470 338" class="flow"/>
  <rect x="70" y="342" width="800" height="108" rx="8" fill="#fff8e5" stroke="#b78316" stroke-width="1.7"/>
  <circle cx="96" cy="369" r="17" fill="#b78316"/>
  <text x="96" y="375" text-anchor="middle" class="sans stage inverse">3</text>
  <text x="124" y="370" class="sans stage">CACHE AND PENDING-REQUEST GATE</text>
  <text x="124" y="396" class="mono body">cache key = doc/version + rows/bodyWidth/viewportWidth + renderer + window</text>
  <text x="124" y="420" class="sans body">one exact-window RenderCache; rowLineStarts/Ends map rows — no warmed-range ledger</text>
  <text x="124" y="442" class="sans body">cache hit or useful pending → reuse; else cancel + submit; approximate repeat &lt; 180 ms → debounce</text>

  <path d="M470 450 L470 470" class="flow"/>
  <rect x="35" y="474" width="870" height="330" rx="10" fill="#e7f4f1" stroke="#218779" stroke-width="1.8"/>
  <text x="65" y="504" class="sans head" fill="#17685e">MINIMAP LANE · FIFO · 1 WORKER</text>
  <text x="875" y="504" text-anchor="end" class="sans small muted">activation → eligible CPU round-robin · no exclusive core</text>

  <rect x="70" y="522" width="800" height="72" rx="7" fill="#ffffff" stroke="#218779" stroke-width="1.5"/>
  <circle cx="96" cy="548" r="17" fill="#218779"/>
  <text x="96" y="554" text-anchor="middle" class="sans stage inverse">4</text>
  <text x="124" y="548" class="mono stage">buildViewportAnchoredLineTexts()</text>
  <text x="124" y="574" class="sans body">read focus line → nextLine toward window EOF → prevLine toward window BOF</text>
  <text x="845" y="574" text-anchor="end" class="sans small muted">bounded copied line texts</text>

  <path d="M470 594 L470 612" class="flow"/>
  <rect x="70" y="616" width="800" height="136" rx="7" fill="#ffffff" stroke="#218779" stroke-width="1.5"/>
  <circle cx="96" cy="643" r="17" fill="#218779"/>
  <text x="96" y="649" text-anchor="middle" class="sans stage inverse">5</text>
  <text x="124" y="643" class="sans stage">DISPLAY-COLUMN REDUCTION</text>
  <text x="124" y="670" class="sans body">UTF-8 width + tab stops; whitespace ignored</text>
  <text x="124" y="693" class="sans body">occupied display span → normalized dot columns</text>
  <text x="124" y="716" class="mono body">uint64 mask / line · max 64 dot columns</text>

  <text x="585" y="642" class="mono small">lines</text>
  <text x="682" y="642" class="mono small">Braille bits</text>
  <text x="590" y="666" class="mono body">L0</text>
  <text x="590" y="687" class="mono body">L1</text>
  <text x="590" y="708" class="mono body">L2</text>
  <text x="590" y="729" class="mono body">L3</text>
  <rect x="640" y="651" width="112" height="88" rx="5" fill="#f3f8fd" stroke="#2d69a6"/>
  <text x="660" y="673" class="mono body">01</text><text x="708" y="673" class="mono body">08</text>
  <text x="660" y="694" class="mono body">02</text><text x="708" y="694" class="mono body">10</text>
  <text x="660" y="715" class="mono body">04</text><text x="708" y="715" class="mono body">20</text>
  <text x="660" y="736" class="mono body">40</text><text x="708" y="736" class="mono body">80</text>
  <text x="780" y="683" class="mono small">pattern byte</text>
  <text x="780" y="708" class="mono small">→ U+2800</text>
  <text x="780" y="730" class="mono small">+ pattern</text>

  <path d="M470 752 L470 766" class="flow"/>
  <rect x="120" y="770" width="700" height="58" rx="7" fill="#d8eee9" stroke="#218779"/>
  <text x="470" y="794" text-anchor="middle" class="mono stage">MiniMapWarmupPayload</text>
  <text x="470" y="816" text-anchor="middle" class="mono small">rowPatterns · rowLineStarts/Ends (row mapping) · window · geometry · totalLines · renderer</text>

  <path d="M470 828 L470 846" class="flow"/>
  <rect x="120" y="850" width="700" height="56" rx="7" fill="#ffffff" stroke="#26364a" stroke-width="1.8"/>
  <text x="470" y="875" text-anchor="middle" class="sans stage">CENTRAL RESULT MAILBOX</text>
  <text x="470" y="896" text-anchor="middle" class="mono small">TaskInfo + status + payload + queue/run/total timing</text>

  <path d="M470 906 L470 930" class="flow"/>
  <line x1="35" y1="936" x2="905" y2="936" stroke="#b03a3a" stroke-width="2.2" stroke-dasharray="9 7"/>
  <rect x="348" y="923" width="244" height="27" rx="13" fill="#f4f6f8" stroke="#b03a3a"/>
  <text x="470" y="942" text-anchor="middle" class="sans small" fill="#8f2929">UI THREAD BOUNDARY</text>

  <rect x="70" y="964" width="800" height="80" rx="8" fill="#f3f8fd" stroke="#2d69a6" stroke-width="1.7"/>
  <circle cx="96" cy="990" r="17" fill="#2d69a6"/>
  <text x="96" y="996" text-anchor="middle" class="sans stage inverse">6</text>
  <text x="124" y="990" class="mono stage">handleCoprocessorResult() → applyWarmup()</text>
  <text x="124" y="1016" class="sans body">completed + document/base-version match + pending task (or missing visible projection)</text>
  <text x="845" y="1036" text-anchor="end" class="sans small muted">adopt cache · clear task · redraw if changed</text>

  <path d="M275 1044 L275 1062" class="flow"/>
  <path d="M665 1044 L665 1062" class="branch"/>
  <rect x="70" y="1066" width="390" height="94" rx="8" fill="#ffffff" stroke="#218779" stroke-width="1.6"/>
  <text x="95" y="1093" class="sans stage">PATTERN CACHE</text>
  <text x="95" y="1118" class="mono body">rowPatterns + row line mapping</text>
  <text x="95" y="1141" class="sans small muted">single window · replaced as a unit · no span merge</text>

  <rect x="480" y="1066" width="390" height="94" rx="8" fill="#fff8e5" stroke="#b78316" stroke-width="1.6"/>
  <text x="505" y="1093" class="sans stage">LIVE OVERLAY MASKS</text>
  <text x="505" y="1118" class="sans body">selection/find · dirty · error/warning · diff slices</text>
  <text x="505" y="1141" class="sans small muted">signature-cached; OR-normalized per document line</text>

  <path d="M275 1160 L275 1180 L445 1180" class="branch"/>
  <path d="M665 1160 L665 1180 L495 1180" class="branch"/>
  <rect x="70" y="1190" width="800" height="108" rx="8" fill="#162235"/>
  <circle cx="96" cy="1217" r="17" fill="#ffffff"/>
  <text x="96" y="1223" text-anchor="middle" class="sans stage">7</text>
  <text x="124" y="1218" class="mono stage inverse">drawGutter() → TDrawBuffer</text>
  <text x="124" y="1245" class="sans body inverse">priority: error &gt; warning &gt; diff missing/insert/offset/equal &gt; find/selection &gt; changed &gt; normal</text>
  <text x="124" y="1269" class="sans body inverse">Braille/block glyph + color · independent viewport marker at infoX (minimum 3 rows)</text>
  <text x="124" y="1291" class="sans small inverse">leading or trailing editor gutter; adjacent TVision scrollbar remains a separate view</text>
</svg>
