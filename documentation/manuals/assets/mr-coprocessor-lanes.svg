<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="1320" viewBox="0 0 940 1320" role="img" aria-labelledby="title desc">
  <title id="title">MR coprocessor execution and result-adoption pipeline</title>
  <desc id="desc">Five numbered panels show domain submission, four non-serial finite-work lanes, independently pinned one-shot workers, the bounded result mailbox, and exact domain adoption. A separate card shows the lifetime-bound external-source exception.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f4b54"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fa3"/>
    </marker>
    <style>
      .title { font: 700 25px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .panel-title { font: 700 19px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .heading { font: 700 14px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #59656e; letter-spacing: 0.4px; }
      .body { font: 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .small { font: 13px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #3f4b54; }
      .tiny { font: 11px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #3f4b54; }
      .code { font: 14px 'Latin Modern Mono', 'DejaVu Sans Mono', monospace; fill: #182128; }
      .badge { font: 700 18px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #ffffff; text-anchor: middle; }
      .box { fill: #f7f8f8; stroke: #27313a; stroke-width: 1.4; }
      .flow { fill: none; stroke: #3f4b54; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2f6fa3; stroke-width: 2; marker-end: url(#arrowBlue); }
      .blue { fill: #dce8f4; stroke: #2f6fa3; stroke-width: 1.6; }
      .green { fill: #dcedeb; stroke: #317c70; stroke-width: 1.4; }
      .lime { fill: #e5f0dd; stroke: #588646; stroke-width: 1.4; }
      .gold { fill: #f3e8d1; stroke: #a77b2f; stroke-width: 1.4; }
      .red { fill: #f4dfd9; stroke: #ad563e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="940" height="1320" fill="#ffffff"/>
  <text x="35" y="35" class="title">COPROCESSOR EXECUTION AND RESULT ADOPTION</text>
  <text x="35" y="59" class="small">Four lanes classify finite work. Work units execute independently. Only the UI thread may adopt a result.</text>

  <rect x="35" y="82" width="870" height="142" rx="8" class="box"/>
  <circle cx="67" cy="114" r="20" fill="#2f6fa3"/>
  <text x="67" y="121" class="badge">1</text>
  <text x="100" y="120" class="panel-title">The domain submits a data-only packet</text>
  <rect x="67" y="143" width="806" height="55" rx="5" class="blue"/>
  <text x="87" y="168" class="code">TaskInfo + TaskFn + immutable input</text>
  <text x="87" y="189" class="small">task · owner kind/local id · lane · document/version · generation · BOF|EOF · half-open span · cancel state</text>

  <path d="M470 224 L470 250" class="flow-blue"/>

  <rect x="35" y="255" width="870" height="225" rx="8" class="box"/>
  <circle cx="67" cy="287" r="20" fill="#2f6fa3"/>
  <text x="67" y="294" class="badge">2</text>
  <text x="100" y="293" class="panel-title">Exactly four finite lanes name distinct workload and result contracts</text>
  <text x="67" y="330" class="heading">CLASSIFICATION · TELEMETRY · RESULT VOCABULARY — NEVER PRIORITY OR A SERIAL QUEUE</text>
  <rect x="67" y="346" width="190" height="82" rx="5" class="gold"/>
  <text x="162" y="373" class="panel-title" text-anchor="middle">I/O</text>
  <text x="162" y="397" class="tiny" text-anchor="middle">finite command · Git · process</text>
  <text x="162" y="416" class="tiny" text-anchor="middle">completion · output · failure</text>
  <rect x="272" y="346" width="190" height="82" rx="5" class="blue"/>
  <text x="367" y="373" class="panel-title" text-anchor="middle">COMPUTE</text>
  <text x="367" y="397" class="tiny" text-anchor="middle">line · syntax · fold · compare</text>
  <text x="367" y="416" class="tiny" text-anchor="middle">Bento · Hex · derived model</text>
  <rect x="477" y="346" width="190" height="82" rx="5" class="green"/>
  <text x="572" y="373" class="panel-title" text-anchor="middle">MINIMAP</text>
  <text x="572" y="397" class="tiny" text-anchor="middle">per-editor density · overlay</text>
  <text x="572" y="416" class="tiny" text-anchor="middle">viewport window · geometry</text>
  <rect x="682" y="346" width="190" height="82" rx="5" fill="#eee7f5" stroke="#7452a6" stroke-width="1.4"/>
  <text x="777" y="373" class="panel-title" text-anchor="middle">MACRO</text>
  <text x="777" y="397" class="tiny" text-anchor="middle">finite VM MacroJob</text>
  <text x="777" y="416" class="tiny" text-anchor="middle">session · staged/deferred result</text>
  <text x="67" y="452" class="body">Lane + TaskKind + execution owner + generation identify different facts about one work unit.</text>
  <text x="873" y="471" text-anchor="end" class="small">Bento is Compute work; registered external sources use the separate lifetime route below.</text>

  <path d="M470 480 L470 505" class="flow-blue"/>

  <rect x="35" y="510" width="870" height="260" rx="8" class="box"/>
  <circle cx="67" cy="542" r="20" fill="#2f6fa3"/>
  <text x="67" y="549" class="badge">3</text>
  <text x="100" y="548" class="panel-title">Each finite work unit receives one stable worker execution</text>
  <rect x="67" y="578" width="250" height="104" rx="6" class="blue"/>
  <text x="87" y="606" class="panel-title">W103 · cpu:7</text>
  <text x="87" y="632" class="code">ED:42 · SYN · gen 17</text>
  <text x="87" y="657" class="small">created → running → result-ready</text>
  <rect x="345" y="578" width="250" height="104" rx="6" class="green"/>
  <text x="365" y="606" class="panel-title">W104 · cpu:8</text>
  <text x="365" y="632" class="code">ED:77 · MAP · gen 5</text>
  <text x="365" y="657" class="small">created → running → result-ready</text>
  <rect x="623" y="578" width="250" height="104" rx="6" class="gold"/>
  <text x="643" y="606" class="panel-title">W105 · cpu:9</text>
  <text x="643" y="632" class="code">HX:12 · HEX · gen 9</text>
  <text x="643" y="657" class="small">created → running → result-ready</text>
  <text x="67" y="715" class="code">assignedCore = allowedCoreIds[workerOrdinal % allowedCoreIds.size()]</text>
  <text x="67" y="743" class="body">The number of workers is not capped by core count; assignments continue strictly modulo.</text>

  <path d="M470 770 L470 795" class="flow-blue"/>

  <rect x="35" y="800" width="870" height="143" rx="8" class="box"/>
  <circle cx="67" cy="832" r="20" fill="#2f6fa3"/>
  <text x="67" y="839" class="badge">4</text>
  <text x="100" y="838" class="panel-title">Immutable results converge on one bounded UI mailbox</text>
  <rect x="67" y="861" width="806" height="55" rx="5" class="green"/>
  <text x="87" y="886" class="code">Result = TaskInfo + status + typed payload + lifecycle ticket</text>
  <text x="87" y="907" class="small">pump(maxResults) / pumpFor(time budget) · no worker may mutate TVision or the live document</text>

  <path d="M470 943 L470 968" class="flow-blue"/>

  <rect x="35" y="973" width="870" height="245" rx="8" class="box"/>
  <circle cx="67" cy="1005" r="20" fill="#2f6fa3"/>
  <text x="67" y="1012" class="badge">5</text>
  <text x="100" y="1011" class="panel-title">The exact domain owner accepts, adopts, or discards</text>
  <rect x="67" y="1042" width="250" height="96" rx="6" class="green"/>
  <text x="192" y="1073" class="panel-title" text-anchor="middle">ACCEPTED</text>
  <text x="192" y="1098" class="small" text-anchor="middle">owner · task · version · span</text>
  <text x="192" y="1120" class="small" text-anchor="middle">ledger may retain the result</text>
  <path d="M317 1090 L345 1090" class="flow"/>
  <rect x="345" y="1042" width="250" height="96" rx="6" class="blue"/>
  <text x="470" y="1073" class="panel-title" text-anchor="middle">ADOPTED</text>
  <text x="470" y="1098" class="small" text-anchor="middle">domain state confirms publication</text>
  <text x="470" y="1120" class="small" text-anchor="middle">model first · projection second</text>
  <rect x="623" y="1042" width="250" height="96" rx="6" class="red"/>
  <text x="748" y="1073" class="panel-title" text-anchor="middle">DISCARDED</text>
  <text x="748" y="1098" class="small" text-anchor="middle">mismatch · cancellation · stale state</text>
  <text x="748" y="1120" class="small" text-anchor="middle">never silently rebased</text>
  <rect x="67" y="1158" width="806" height="39" rx="5" fill="#e8f0f2" stroke="#27313a" stroke-width="1.2"/>
  <text x="87" y="1183" class="small">Lifecycle remains visible through accepted/adopted/discarded and the worker's independent finished event.</text>

  <rect x="35" y="1234" width="870" height="77" rx="6" class="lime"/>
  <text x="55" y="1258" class="heading">SEPARATE LIFETIME ROUTE · Lane::Extern IS NOT A FIFTH FINITE SNAPSHOT LANE</text>
  <text x="55" y="1280" class="small">A blocking file, journal, device, network, pipe, or process source may keep one exclusive worker.</text>
  <text x="55" y="1302" class="small">EOF, close, cancel, error, or process end must wake, terminate, and join that source lifetime.</text>
</svg>
