<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="900" viewBox="0 0 1080 900" role="img" aria-labelledby="title desc">
  <title id="title">MRMAC execution-session routes</title>
  <desc id="desc">Four numbered panels show event producers and logical sessions, runner route selection, UI-affine versus finite one-shot background execution, and staged result adoption without a retained worker.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f4b54"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fa3"/>
    </marker>
    <style>
      .title { font: 700 25px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .panel-title { font: 700 20px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .heading { font: 700 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #59656e; letter-spacing: 0.4px; }
      .body { font: 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .small { font: 13px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #3f4b54; }
      .code { font: 14px 'Latin Modern Mono', 'DejaVu Sans Mono', monospace; fill: #182128; }
      .badge { font: 700 18px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #ffffff; text-anchor: middle; }
      .box { fill: #f7f8f8; stroke: #27313a; stroke-width: 1.4; }
      .flow { fill: none; stroke: #3f4b54; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2f6fa3; stroke-width: 2; marker-end: url(#arrowBlue); }
      .blue { fill: #dce8f4; stroke: #2f6fa3; stroke-width: 1.6; }
      .green { fill: #dcedeb; stroke: #317c70; stroke-width: 1.4; }
      .lime { fill: #e5f0dd; stroke: #588646; stroke-width: 1.4; }
      .gold { fill: #f3e8d1; stroke: #a77b2f; stroke-width: 1.4; }
      .purple { fill: #eee7f5; stroke: #7452a6; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1080" height="900" fill="#ffffff"/>
  <text x="40" y="35" class="title">MRMAC EXECUTION SESSION ROUTES</text>
  <text x="40" y="59" class="small">The logical session owns execution state; a finite background job owns only one worker lifetime.</text>

  <rect x="40" y="82" width="1000" height="164" rx="8" class="box"/>
  <circle cx="72" cy="114" r="20" fill="#2f6fa3"/>
  <text x="72" y="121" class="badge">1</text>
  <text x="105" y="120" class="panel-title">A producer creates or resumes one logical Execution Session</text>
  <rect x="70" y="151" width="285" height="65" rx="6" class="blue"/>
  <text x="212" y="180" class="panel-title" text-anchor="middle">PRODUCERS</text>
  <text x="212" y="203" class="small" text-anchor="middle">keymap · timer · MMP callback</text>
  <path d="M355 183 L415 183" class="flow"/>
  <rect x="415" y="151" width="595" height="65" rx="6" class="gold"/>
  <text x="712" y="180" class="panel-title" text-anchor="middle">EXECUTION SESSION</text>
  <text x="712" y="203" class="small" text-anchor="middle">session ID · owner · route · state · closure · pending adoption</text>

  <path d="M540 246 L540 272" class="flow-blue"/>

  <rect x="40" y="277" width="1000" height="154" rx="8" class="box"/>
  <circle cx="72" cy="309" r="20" fill="#2f6fa3"/>
  <text x="72" y="316" class="badge">2</text>
  <text x="105" y="315" class="panel-title">The macro runner classifies bytecode and selects the route</text>
  <rect x="70" y="346" width="940" height="55" rx="6" class="purple"/>
  <text x="90" y="371" class="code">ordinary UI · foreground delay · background · staged background</text>
  <text x="90" y="392" class="small">The scheduler controls due time and overlap policy; it does not decide thread affinity.</text>

  <path d="M540 431 L540 457" class="flow-blue"/>

  <rect x="40" y="462" width="1000" height="231" rx="8" class="box"/>
  <circle cx="72" cy="494" r="20" fill="#2f6fa3"/>
  <text x="72" y="501" class="badge">3</text>
  <text x="105" y="500" class="panel-title">UI-affine and background routes retain distinct lifetimes</text>
  <rect x="70" y="531" width="430" height="125" rx="6" class="blue"/>
  <text x="285" y="562" class="panel-title" text-anchor="middle">UI THREAD ROUTE</text>
  <text x="285" y="589" class="body" text-anchor="middle">ordinary execution or foreground delay</text>
  <text x="285" y="615" class="small" text-anchor="middle">event-loop continuation · no coprocessor worker</text>
  <text x="285" y="638" class="small" text-anchor="middle">typed UI work remains staged/projection-based</text>
  <rect x="580" y="531" width="430" height="125" rx="6" class="green"/>
  <text x="795" y="562" class="panel-title" text-anchor="middle">FINITE MACROJOB</text>
  <text x="795" y="589" class="body" text-anchor="middle">one one-shot worker · Macro classification lane</text>
  <text x="795" y="615" class="code" text-anchor="middle">workerOrdinal % allowedCoreCount</text>
  <text x="795" y="638" class="small" text-anchor="middle">worker ends after result-ready</text>
  <text x="70" y="680" class="small">A paused session or a session waiting for UI adoption does not keep an OS thread blocked.</text>

  <path d="M795 693 L795 719" class="flow-blue"/>

  <rect x="40" y="724" width="1000" height="145" rx="8" class="box"/>
  <circle cx="72" cy="756" r="20" fill="#2f6fa3"/>
  <text x="72" y="763" class="badge">4</text>
  <text x="105" y="762" class="panel-title">Background data returns through exact domain acceptance</text>
  <rect x="70" y="793" width="285" height="50" rx="6" class="green"/>
  <text x="212" y="824" class="panel-title" text-anchor="middle">RESULT MAILBOX</text>
  <path d="M355 818 L415 818" class="flow"/>
  <rect x="415" y="793" width="285" height="50" rx="6" class="gold"/>
  <text x="557" y="824" class="panel-title" text-anchor="middle">CONFLICT GATE</text>
  <path d="M700 818 L760 818" class="flow"/>
  <rect x="760" y="793" width="250" height="50" rx="6" class="lime"/>
  <text x="885" y="824" class="panel-title" text-anchor="middle">SESSION RESUMES</text>
  <text x="70" y="860" class="small">A rejected staged result is discarded as a whole; the session is never silently rebased onto newer state.</text>
</svg>
