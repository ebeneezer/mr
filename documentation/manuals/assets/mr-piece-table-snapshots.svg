<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="720" viewBox="0 0 1080 720" role="img" aria-labelledby="title desc">
  <title id="title">Piece Table ownership and snapshot boundary</title>
  <desc id="desc">Three numbered panels show immutable and append-only byte sources, the versioned live Piece Table and ReadSnapshot, and background derivation followed by exact UI-thread adoption.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#3f4b54"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f6fa3"/>
    </marker>
    <style>
      .title { font: 700 25px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .panel-title { font: 700 20px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .heading { font: 700 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #59656e; letter-spacing: 0.4px; }
      .body { font: 15px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #182128; }
      .small { font: 13px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #3f4b54; }
      .code { font: 14px 'Latin Modern Mono', 'DejaVu Sans Mono', monospace; fill: #182128; }
      .badge { font: 700 18px 'Latin Modern Sans', 'DejaVu Sans', sans-serif; fill: #ffffff; text-anchor: middle; }
      .box { fill: #f7f8f8; stroke: #27313a; stroke-width: 1.4; }
      .flow { fill: none; stroke: #3f4b54; stroke-width: 1.8; marker-end: url(#arrow); }
      .flow-blue { fill: none; stroke: #2f6fa3; stroke-width: 2; marker-end: url(#arrowBlue); }
      .blue { fill: #dce8f4; stroke: #2f6fa3; stroke-width: 1.6; }
      .green { fill: #dcedeb; stroke: #317c70; stroke-width: 1.4; }
      .lime { fill: #e5f0dd; stroke: #588646; stroke-width: 1.4; }
      .gold { fill: #f3e8d1; stroke: #a77b2f; stroke-width: 1.4; }
      .red { fill: #f4dfd9; stroke: #ad563e; stroke-width: 1.4; }
    </style>
  </defs>

  <rect width="1080" height="720" fill="#ffffff"/>
  <text x="40" y="35" class="title">PIECE TABLE OWNERSHIP AND SNAPSHOT BOUNDARY</text>
  <text x="40" y="59" class="small">Original bytes remain immutable; edits change references and append data; background work receives a version ticket.</text>

  <rect x="40" y="82" width="1000" height="174" rx="8" class="box"/>
  <circle cx="72" cy="114" r="20" fill="#2f6fa3"/>
  <text x="72" y="121" class="badge">1</text>
  <text x="105" y="120" class="panel-title">The live document owns two byte sources</text>
  <rect x="70" y="151" width="420" height="75" rx="6" class="blue"/>
  <text x="280" y="181" class="panel-title" text-anchor="middle">ORIGINAL FILE</text>
  <text x="280" y="207" class="small" text-anchor="middle">private read-only mmap or owned immutable text</text>
  <rect x="590" y="151" width="420" height="75" rx="6" class="green"/>
  <text x="800" y="181" class="panel-title" text-anchor="middle">ADD BUFFER</text>
  <text x="800" y="207" class="small" text-anchor="middle">append-only bytes created by edits</text>

  <path d="M540 256 L540 282" class="flow-blue"/>

  <rect x="40" y="287" width="1000" height="175" rx="8" class="box"/>
  <circle cx="72" cy="319" r="20" fill="#2f6fa3"/>
  <text x="72" y="326" class="badge">2</text>
  <text x="105" y="325" class="panel-title">The Piece Table defines one live version and one immutable read view</text>
  <rect x="70" y="355" width="420" height="76" rx="6" class="gold"/>
  <text x="280" y="384" class="panel-title" text-anchor="middle">TextDocument · version N</text>
  <text x="280" y="410" class="small" text-anchor="middle">piece references · line state · canonical mutable owner</text>
  <path d="M490 393 L590 393" class="flow"/>
  <rect x="590" y="355" width="420" height="76" rx="6" class="blue"/>
  <text x="800" y="384" class="panel-title" text-anchor="middle">ReadSnapshot</text>
  <text x="800" y="410" class="small" text-anchor="middle">document identity · base version · immutable sources</text>

  <path d="M540 462 L540 488" class="flow-blue"/>

  <rect x="40" y="493" width="1000" height="171" rx="8" class="box"/>
  <circle cx="72" cy="525" r="20" fill="#2f6fa3"/>
  <text x="72" y="532" class="badge">3</text>
  <text x="105" y="531" class="panel-title">Background work derives data; only the UI thread may adopt it</text>
  <rect x="70" y="562" width="360" height="72" rx="6" class="green"/>
  <text x="250" y="591" class="panel-title" text-anchor="middle">DERIVED RESULT</text>
  <text x="250" y="615" class="small" text-anchor="middle">projection, ledger packet, or staged edit</text>
  <path d="M430 598 L495 598" class="flow"/>
  <rect x="495" y="562" width="230" height="72" rx="6" class="gold"/>
  <text x="610" y="591" class="panel-title" text-anchor="middle">EXACT GATE</text>
  <text x="610" y="615" class="small" text-anchor="middle">identity + base version</text>
  <path d="M725 598 L790 598" class="flow"/>
  <rect x="790" y="562" width="220" height="72" rx="6" class="lime"/>
  <text x="900" y="591" class="panel-title" text-anchor="middle">ADOPT</text>
  <text x="900" y="615" class="small" text-anchor="middle">model first · project later</text>

  <rect x="40" y="684" width="1000" height="26" rx="5" fill="#e8f0f2" stroke="#27313a" stroke-width="1.2"/>
  <text x="60" y="702" class="small">A result from a different document or base version is discarded; it is never silently rebased.</text>
</svg>
